name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run validations and npm publish --dry-run only"
        required: true
        default: true
        type: boolean
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Pack dry run
        run: |
          npm publish --workspace @bjalon/object-vcs-core --access public --dry-run
          npm publish --workspace @bjalon/object-vcs-firebase --access public --dry-run
          npm publish --workspace @bjalon/object-vcs-http --access public --dry-run
          npm publish --workspace @bjalon/object-vcs-react --access public --dry-run
          npm publish --workspace @bjalon/object-vcs-vue --access public --dry-run
          npm publish --workspace @bjalon/object-vcs-vanilla --access public --dry-run

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace @bjalon/object-vcs-core --access public --provenance
          npm publish --workspace @bjalon/object-vcs-firebase --access public --provenance
          npm publish --workspace @bjalon/object-vcs-http --access public --provenance
          npm publish --workspace @bjalon/object-vcs-react --access public --provenance
          npm publish --workspace @bjalon/object-vcs-vue --access public --provenance
          npm publish --workspace @bjalon/object-vcs-vanilla --access public --provenance
